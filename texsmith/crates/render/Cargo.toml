[package]
name = "texsmith-render"
description = "Texsmith wgpu viewport renderer: PBR, image-based lighting, debug views, UV view"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
texsmith-core = { workspace = true }
texsmith-texel = { workspace = true }
texsmith-geom = { workspace = true }
texsmith-compose = { workspace = true }
texsmith-bake = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

# The browser's WebGPU resolves error scopes later: their results are awaited on the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
image = { workspace = true }
