<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Texsmith</title>
  <link data-trunk rel="rust" data-bin="texsmith-web" data-cargo-profile="wasm-release" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1c1c1c; }
    /* Touch and pen strokes paint and orbit; the browser must not scroll, zoom or select. */
    #texsmith_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #texsmith_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; background: #1c1c1c; }
    #texsmith_loading h1 { margin: 0; color: #f2f2f2; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
    #texsmith_loading p { margin: 0; max-width: 420px; line-height: 1.5; }
    #texsmith_loading a { color: #e0e0e0; pointer-events: auto; }
    /* Indeterminate while the WebAssembly downloads (the page has no script to measure it); the
       app sets its value through the startup steps once it runs. */
    #texsmith_progress { width: min(280px, 70vw); height: 4px; border: 0; border-radius: 2px; background: #333; color: #2f86eb; accent-color: #2f86eb; }
    #texsmith_progress::-webkit-progress-bar { background: #333; border-radius: 2px; }
    #texsmith_progress::-webkit-progress-value { background: #2f86eb; border-radius: 2px; }
    #texsmith_progress::-moz-progress-bar { background: #2f86eb; border-radius: 2px; }
    /* Styled progress bars lose the native "busy" animation: a sweep stands in while downloading. */
    #texsmith_progress:indeterminate { background: linear-gradient(90deg, #333 0%, #2f86eb 50%, #333 100%) 0 0 / 300% 100%;
      animation: texsmith-busy 1.4s linear infinite; }
    #texsmith_progress:indeterminate::-webkit-progress-bar { background: transparent; }
    #texsmith_progress:indeterminate::-moz-progress-bar { background: transparent; }
    @keyframes texsmith-busy { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    #texsmith_status { font-size: 12px; color: #969696; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #texsmith_stalled { color: #8c8c8c; visibility: hidden; animation: texsmith-stalled 0s 30s forwards; }
    @keyframes texsmith-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="texsmith_canvas"></canvas>
  <div id="texsmith_loading" role="status" aria-live="polite">
    <h1>Texsmith</h1>
    <progress id="texsmith_progress" max="1" aria-label="Loading Texsmith"></progress>
    <p id="texsmith_status">Downloading&hellip;</p>
    <p id="texsmith_stalled">This is taking longer than usual. If Texsmith doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
