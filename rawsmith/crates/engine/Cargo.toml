[package]
name = "rawsmith-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rawsmith engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
craft-docpath = { workspace = true }
rawsmith-geom = { workspace = true }
rawsmith-color = { workspace = true }
rawsmith-raster = { workspace = true }
rawsmith-develop = { workspace = true }
rawsmith-scenes = { workspace = true }
rawsmith-pipeline = { workspace = true }
rawsmith-gpu = { workspace = true }
rawsmith-catalog = { workspace = true }
web-time = { workspace = true }
rawsmith-preview = { workspace = true }
rawsmith-codecs = { workspace = true }
rawsmith-raw = { workspace = true }
rawsmith-denoise-core = { workspace = true }
rawsmith-denoise = { workspace = true, optional = true }
rawsmith-meta = { workspace = true }
rawsmith-lensdb = { workspace = true }
rawsmith-faces = { workspace = true }
miniz_oxide = { workspace = true }
rawsmith-merge = { workspace = true }
rawsmith-geocode = { workspace = true }
rawsmith-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.13", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
rawsmith-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rawsmith-fetch = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }
# free space of the drive holding the preview cache (the low-disk alert; pure Rust: rustix / windows-sys)
fs4 = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:rawsmith-segment"]
denoise = ["dep:rawsmith-denoise", "rawsmith-denoise/runtime", "rawsmith-gpu/denoise"]
rawnind-model = ["denoise", "rawsmith-denoise/rawnind-model", "rawsmith-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
rawsmith-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
rawsmith-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
rawsmith-tiff = { workspace = true }
