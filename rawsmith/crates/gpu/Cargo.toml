[package]
name = "rawsmith-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rawsmith GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
rawsmith-denoise = { workspace = true, optional = true }
rawsmith-geom = { workspace = true }
rawsmith-color = { workspace = true }
rawsmith-raster = { workspace = true }
rawsmith-develop = { workspace = true }
rawsmith-faces = { workspace = true }
rawsmith-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:rawsmith-denoise", "rawsmith-denoise/runtime"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
rawsmith-testkit = { workspace = true }
rawsmith-scenes = { workspace = true }
rawsmith-raw = { workspace = true }
