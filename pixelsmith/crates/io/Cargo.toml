[package]
name = "pixelsmith-io"
description = "Import/export between pixelsmith documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to pixelsmith-codecs; see its `heif` feature).
heif = ["pixelsmith-codecs/heif"]
# Test support for synthetic memory injection, estimate charges and verification across crates.
testgen = []

[dependencies]
pixelsmith-geom = { workspace = true }
pixelsmith-color = { workspace = true }
pixelsmith-cms = { workspace = true }
pixelsmith-raster = { workspace = true }
pixelsmith-doc = { workspace = true }
pixelsmith-compose = { workspace = true }
pixelsmith-algo = { workspace = true }
pixelsmith-psd = { workspace = true }
pixelsmith-codecs = { workspace = true }
pixelsmith-raw = { workspace = true }
pixelsmith-affinity = { workspace = true }
pixelsmith-text = { workspace = true }
pixelsmith-paint = { workspace = true }
pixelsmith-vector = { workspace = true }
pixelsmith-format = { path = "../format" }
craft-docpath = { workspace = true }
thiserror = { workspace = true }
ttf-parser = "0.25.1"
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.21"
# Reuse usvg's locked header reader to bound embedded SVG raster data before decoding.
imagesize = "0.13"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
lopdf = { version = "0.38", default-features = false }
miniz_oxide = "0.9"
crc32fast = "1.5"
pixelsmith-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
pixelsmith-psd = { workspace = true, features = ["testgen"] }
pixelsmith-raw = { workspace = true, features = ["testgen"] }
pixelsmith-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless JPEG XL encoder for the JPEG XL DNG preview test (tests only), as in pixelsmith-raw.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = { workspace = true }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
