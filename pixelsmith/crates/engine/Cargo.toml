[package]
name = "pixelsmith-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
pixelsmith-geom = { workspace = true }
pixelsmith-color = { workspace = true }
pixelsmith-cms = { workspace = true }
pixelsmith-raster = { workspace = true }
pixelsmith-doc = { workspace = true }
pixelsmith-ops = { workspace = true }
pixelsmith-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
pixelsmith-paint = { workspace = true }
pixelsmith-algo = { workspace = true }
pixelsmith-text = { workspace = true }
pixelsmith-vector = { workspace = true }
pixelsmith-io = { workspace = true }
pixelsmith-psd = { workspace = true }
pixelsmith-format = { workspace = true }
pixelsmith-plugins = { workspace = true }
base64 = "0.22"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
pixelsmith-codecs = { workspace = true }
flate2 = { workspace = true }
craft-print = { workspace = true }

# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through pixelsmith-ui-egui and usvg.
roxmltree = "0.21"
# Release tags use the same semantic versions as Cargo.
semver = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
chrono = { workspace = true }

# `file_cmds::same_file` on Windows: the volume serial number and file index, so a hard link to a
# file is that file (std's `MetadataExt::file_index` is unstable).
[target.'cfg(windows)'.dependencies]
same-file = "1"
# `file.print` loads Windows.Data.Pdf.dll before calling into it (#5884): the safe binding
# ui-egui and craft-print already use, pinned to the same version.
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

# Printing on Unix: an IPP client for CUPS (pure Rust); the web build cannot print.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
pixelsmith-ipp = { workspace = true }

[dev-dependencies]
pixelsmith-affinity = { workspace = true, features = ["synth"] }
pixelsmith-io = { workspace = true, features = ["testgen"] }
# Synthetic camera raw files for the open tests.
pixelsmith-raw = { workspace = true, features = ["testgen"] }
pixelsmith-testkit = { workspace = true }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
