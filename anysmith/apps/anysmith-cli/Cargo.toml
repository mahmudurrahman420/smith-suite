[package]
name = "anysmith-cli"
description = "Anysmith on the command line: every tool, the MCP server, setup and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anysmith-engine = { workspace = true }
anysmith-engines = { workspace = true }
anysmith-evidence = { workspace = true }
anysmith-platform = { workspace = true }
anysmith-mcp = { workspace = true }
anysmith-ai = { workspace = true }
anysmith-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
wasm-plugins = ["anysmith-engine/wasm-plugins"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The DPI-aware manifest for anysmith-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
