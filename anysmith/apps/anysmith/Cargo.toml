[package]
name = "anysmith"
description = "Anysmith: find out how any software works, then craft your own"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
anysmith-engine = { workspace = true }
anysmith-platform = { workspace = true }
anysmith-ai = { workspace = true }
anysmith-setup = { workspace = true }
anysmith-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
log = { workspace = true }
# The one dialog the app shows itself: when its window can't open, so a start that shows nothing
# still says why (#166).
rfd = { workspace = true }

[features]
wasm-plugins = ["anysmith-engine/wasm-plugins"]

[build-dependencies]
# Icon + VERSIONINFO for anysmith.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
