[package]
name = "pathsmith-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pathsmith tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
pathsmith-geom = { workspace = true }
pathsmith-color = { workspace = true }
pathsmith-doc = { workspace = true }
pathsmith-brush = { workspace = true }
pathsmith-pathops = { workspace = true }
pathsmith-effects = { workspace = true }
pathsmith-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
pathsmith-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
