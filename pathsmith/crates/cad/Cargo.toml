[package]
name = "pathsmith-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pathsmith CAD interchange: a hand-written ASCII DXF writer (R12 to 2018)"

[lints]
workspace = true

[dependencies]
pathsmith-geom = { workspace = true }
pathsmith-color = { workspace = true }
pathsmith-doc = { workspace = true }
pathsmith-effects = { workspace = true }
pathsmith-brush = { workspace = true }
pathsmith-pathops = { workspace = true }
pathsmith-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine)
# and in fonts built in code (`pathsmith_text::test_fonts`).
pathsmith-text = { workspace = true, features = ["bundled-fonts", "test-fonts"] }
