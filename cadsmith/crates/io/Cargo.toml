[package]
name = "cadsmith-io"
description = "CADsmith file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadsmith-geom = { workspace = true }
cadsmith-color = { workspace = true }
cadsmith-doc = { workspace = true }
cadsmith-dxf = { workspace = true }
cadsmith-dwg = { workspace = true }
cadsmith-render = { workspace = true }
cadsmith-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.9"
craft-pdf = { workspace = true, features = ["write"] }
quick-xml = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# Reads CADsmith's DWG output as written (tests only; the same version as cadsmith-dwg's).
acadrust = "0.6.6"
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }
