[package]
name = "mocksmith-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mocksmith engine: sessions, undo history, the command registry every surface (UI, CLI, control channel, MCP) dispatches through, pointer tools, components and the Figma menu catalog"

[lints]
workspace = true

[dependencies]
mocksmith-geom = { workspace = true }
mocksmith-color = { workspace = true }
mocksmith-doc = { workspace = true }
mocksmith-collab = { workspace = true }
mocksmith-layout = { workspace = true }
mocksmith-text = { workspace = true }
mocksmith-pathops = { workspace = true }
mocksmith-render = { workspace = true }
mocksmith-format = { workspace = true }
mocksmith-svg = { workspace = true }
mocksmith-pdf = { workspace = true }
mocksmith-vectordrawable = { workspace = true }
craft-docpath = { workspace = true }
mocksmith-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
deunicode = { workspace = true }
same-file = { workspace = true }
web-time = "1.1.0"

# Downloading a missing font (desktop only; the web keeps its built-in fonts). The bundled index
# (~620 KB) lets the Missing fonts window tell which fonts can be downloaded without a request.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-font-store = { workspace = true, features = ["bundled-index"] }
craft-font-catalog = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
wat = { workspace = true }
image = { workspace = true }
