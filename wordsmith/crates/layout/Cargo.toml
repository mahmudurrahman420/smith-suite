[package]
name = "wordsmith-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wordsmith layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[dependencies]
wordsmith-geom = { workspace = true, features = ["image"] }
wordsmith-doc = { workspace = true }
wordsmith-fonts = { workspace = true }
wordsmith-proof = { workspace = true }
wordsmith-metafile = { workspace = true }
kurbo = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
wordsmith-doc = { workspace = true, features = ["test-support"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32-unknown-unknown).
js-sys = "0.3"
