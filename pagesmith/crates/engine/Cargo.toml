[package]
name = "pagesmith-engine"
description = "Pagesmith engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
pagesmith-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pagesmith-render = { workspace = true }
pagesmith-cos = { workspace = true }
pagesmith-organize = { workspace = true }
pagesmith-annot = { workspace = true }
pagesmith-forms = { workspace = true }
pagesmith-xfa = { workspace = true }
pagesmith-edit = { workspace = true }
pagesmith-content = { workspace = true }
pagesmith-audit = { workspace = true }
pagesmith-redact = { workspace = true }
pagesmith-print = { workspace = true }
pagesmith-xfdf = { workspace = true }
pagesmith-sign = { workspace = true }
pagesmith-optimize = { workspace = true }
pagesmith-a11y = { workspace = true }
pagesmith-ocr = { workspace = true }
pagesmith-js = { workspace = true }
pagesmith-compare = { workspace = true }
pagesmith-preflight = { workspace = true }
pagesmith-export = { workspace = true }
pagesmith-fonts = { workspace = true }
pagesmith-create = { workspace = true }
pagesmith-model = { workspace = true }
pagesmith-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and pagesmith-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
pagesmith-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
pagesmith-filters = { workspace = true }
