[package]
name = "layoutsmith-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layoutsmith text composition: paragraph composer (Knuth–Plass), hyphenation, justification, columns, threading, wrap"

[lints]
workspace = true

[dependencies]
unicode-bidi = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-script = { workspace = true }
layoutsmith-geom = { workspace = true }
layoutsmith-color = { workspace = true }
layoutsmith-doc = { workspace = true }
layoutsmith-fonts = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
miniz_oxide = "0.8"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "dutch", "french", "german", "greek", "italian", "portuguese", "spanish", "norwegian", "danish"] }

[dev-dependencies]
layoutsmith-fonts = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
