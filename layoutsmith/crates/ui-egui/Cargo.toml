[package]
name = "layoutsmith-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Layoutsmith egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true, features = ["native-windows"] }
craft-window = { workspace = true }
craft-keymap = { workspace = true }
layoutsmith-geom = { workspace = true }
layoutsmith-color = { workspace = true }
layoutsmith-doc = { workspace = true }
layoutsmith-fonts = { workspace = true }
layoutsmith-compose = { workspace = true }
layoutsmith-render = { workspace = true }
layoutsmith-tools = { workspace = true }
layoutsmith-engine = { workspace = true }
layoutsmith-textimport = { workspace = true }
craft-prepress = { workspace = true }
# The UI draws monochrome icon glyphs from egui's bundled emoji faces (☰, ⚠, 📋); 0.37 moved
# them behind this feature. They stay bundled copies of OSI/CC0 faces from `epaint_default_fonts`.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
web-time = { workspace = true }
# Unicode bidi classes are used only to bypass the label cache for ordinary LTR text.
unicode-bidi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# egui 0.37 no longer enables `default_fonts` for library consumers; egui_kittest disables
# egui's defaults, and package-scoped UI tests do not build the app binary.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
tempfile = { workspace = true }
layoutsmith-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
layoutsmith-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
# File and message dialogs that never block the frame; the browser build uses its own path.
craft-dialogs = { workspace = true }
raw-window-handle = { workspace = true }
