[package]
name = "layoutsmith-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layoutsmith renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
layoutsmith-geom = { workspace = true }
layoutsmith-color = { workspace = true }
layoutsmith-doc = { workspace = true }
layoutsmith-fonts = { workspace = true }
layoutsmith-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
layoutsmith-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
