[package]
name = "layoutsmith-images"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layoutsmith placed-graphic decoding: raster formats (PNG, JPEG, GIF, WebP, TIFF, BMP, PSD) and SVG"

[lints]
workspace = true

[dependencies]
layoutsmith-color = { workspace = true }
layoutsmith-fonts = { workspace = true }
image = { workspace = true }
tiff = { workspace = true }
resvg = { workspace = true }
skrifa = { workspace = true }
quick-xml = { workspace = true }
flate2 = "1"
log = { workspace = true }
craft-cms = { workspace = true }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = "0.5"

[dev-dependencies]
layoutsmith-fonts = { workspace = true, features = ["testing"] }
