[package]
name = "layoutsmith-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layoutsmith PDF export (krilla): real text with embedded font subsets, CMYK/spot colour, bleed and printer's marks"

[lints]
workspace = true

[dependencies]
layoutsmith-geom = { workspace = true }
layoutsmith-color = { workspace = true }
layoutsmith-doc = { workspace = true }
layoutsmith-fonts = { workspace = true }
layoutsmith-compose = { workspace = true }
craft-pdf = { workspace = true, features = ["write-pdf"] }
craft-prepress = { workspace = true }
craft-cms = { workspace = true }
krilla-svg = { workspace = true }
layoutsmith-images = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# The placed-PDF version check names hayro's PdfVersion (krilla::pdf::Pdf::version returns it).
hayro-syntax = "0.7.2"

[dev-dependencies]
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }
tiff = { workspace = true }
flate2 = "1"
layoutsmith-fonts = { workspace = true, features = ["testing"] }
