[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.21.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/mahmudurrahman420/motionsmith"

[workspace.dependencies]
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", version = "=0.1.0", default-features = false, features = ["read"] }
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-quit = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-ecproj-format = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "ca1b5e2edb8568335c6c14f390307bd5beae8238" }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["egui"] }
# internal
motionsmith-time = { path = "crates/time" }
motionsmith-geom = { path = "crates/geom" }
motionsmith-color = { path = "crates/color" }
motionsmith-raster = { path = "crates/raster" }
motionsmith-path = { path = "crates/path" }
motionsmith-keyframe = { path = "crates/keyframe" }
motionsmith-project = { path = "crates/project" }
motionsmith-text = { path = "crates/text" }
motionsmith-effects = { path = "crates/effects" }
motionsmith-track = { path = "crates/track" }
motionsmith-segment = { path = "crates/segment" }
motionsmith-sam2 = { path = "crates/sam2" }
motionsmith-model = { path = "crates/model" }
motionsmith-render = { path = "crates/render" }
motionsmith-gpu = { path = "crates/gpu" }
motionsmith-media = { path = "crates/media" }
motionsmith-export = { path = "crates/export" }
motionsmith-expr = { path = "crates/expr" }
motionsmith-lottie = { path = "crates/lottie" }
motionsmith-interchange = { path = "crates/interchange" }
motionsmith-pdf = { path = "crates/pdf" }
motionsmith-psd = { path = "crates/psd" }
motionsmith-aep = { path = "crates/aep" }
motionsmith-vp9enc = { path = "crates/vp9enc" }
motionsmith-svg = { path = "crates/svg" }
motionsmith-engine = { path = "crates/engine" }
motionsmith-host = { path = "crates/host" }
motionsmith-ui-egui = { path = "crates/ui-egui" }
motionsmith-automation = { path = "crates/automation" }
motionsmith-opusenc = { path = "crates/opusenc" }
motionsmith-script = { path = "crates/script" }
motionsmith-hevcenc = { path = "crates/hevcenc" }
motionsmith-av1enc = { path = "crates/av1enc" }
motionsmith-plugin = { path = "crates/plugin" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
same-file = "1.0"
tempfile = "3.27"

# media codecs + containers: Framesmith's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
framesmith-codecs = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-media = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-frame = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-color = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-time = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
# encoders + muxer (crates/export)
framesmith-h264enc = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-prores = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-aac = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-isobmff = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
# container headers read for AAC channel layouts (crates/media)
framesmith-matroska = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-mpegts = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
# decoder used as the round-trip oracle of motionsmith-opusenc (crates/export dev-dependency)
framesmith-opus = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-vp9 = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
# decoders used as the round-trip oracles of motionsmith-hevcenc / motionsmith-av1enc (dev-dependencies only)
framesmith-hevc = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-av1 = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
framesmith-interchange = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-project = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }
framesmith-geom = { git = "https://github.com/mahmudurrahman420/framesmith", rev = "09aaf9bf15d510eda1c413c0ccabb1d7e08b41c5" }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "1"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
# Shared UI and the complete egui family select reviewed immutable commits below.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", features = ["serde"] }
# `default_fonts` and `monochrome_emoji_fonts` are explicit: the app's `FontDefinitions::default()`
# and its `✔`/`▣` chrome glyphs need both, and kittest's own dev-dependencies do not propagate.
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against a Framesmith checkout next to this repo: uncomment.
# [patch."https://github.com/mahmudurrahman420/framesmith"]
# framesmith-codecs = { path = "../framesmith/crates/codecs" }
# framesmith-media = { path = "../framesmith/crates/media" }
# framesmith-frame = { path = "../framesmith/crates/frame" }
# framesmith-color = { path = "../framesmith/crates/color" }
# framesmith-time = { path = "../framesmith/crates/time" }
# framesmith-h264enc = { path = "../framesmith/crates/h264enc" }
# framesmith-prores = { path = "../framesmith/crates/prores" }
# framesmith-aac = { path = "../framesmith/crates/aac" }
# framesmith-isobmff = { path = "../framesmith/crates/isobmff" }
# framesmith-matroska = { path = "../framesmith/crates/matroska" }
# framesmith-mpegts = { path = "../framesmith/crates/mpegts" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Panics and backtraces keep file and line; full debug info only made the many test binaries large.
debug = "line-tables-only"

# Same settings as `dev`, but with full debug info for interactive debugger sessions: local
# variables, parameters and column breakpoints work. Use `--profile dev-full` when debugging;
# everything else stays on the fast default. See CONTRIBUTING.md, "Setup".
[profile.dev-full]
inherits = "dev"
debug = true

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.motionsmith-raster]
opt-level = 3

[profile.dev.package.motionsmith-render]
opt-level = 3

[profile.dev.package.motionsmith-gpu]
opt-level = 3

[profile.dev.package.motionsmith-effects]
opt-level = 3

[profile.dev.package.motionsmith-track]
opt-level = 3

[profile.dev.package.motionsmith-path]
opt-level = 3

[profile.dev.package.motionsmith-media]
opt-level = 3

[profile.dev.package.motionsmith-opusenc]
opt-level = 3

[profile.dev.package.motionsmith-export]
opt-level = 3

[profile.dev.package.motionsmith-vp9enc]
opt-level = 3

[profile.dev.package.motionsmith-hevcenc]
opt-level = 3

[profile.dev.package.motionsmith-av1enc]
opt-level = 3

# Framesmith codec hot loops (same settings as Framesmith's own workspace).
[profile.dev.package.framesmith-h264]
opt-level = 3

[profile.dev.package.framesmith-h264enc]
opt-level = 3

[profile.dev.package.framesmith-hevc]
opt-level = 3

[profile.dev.package.framesmith-vp9]
opt-level = 3

[profile.dev.package.framesmith-prores]
opt-level = 3

[profile.dev.package.framesmith-dnx]
opt-level = 3

[profile.dev.package.framesmith-av1]
opt-level = 3

[profile.dev.package.framesmith-aac]
opt-level = 3

[profile.dev.package.framesmith-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", version = "=0.3.0" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
