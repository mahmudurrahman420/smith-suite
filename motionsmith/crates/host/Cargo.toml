[package]
name = "motionsmith-host"
description = "Builds a fully wired Motionsmith session: media decoding (Framesmith codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
motionsmith-engine = { workspace = true }
motionsmith-project = { workspace = true }
log = { workspace = true }
motionsmith-media = { workspace = true }
motionsmith-expr = { workspace = true }
motionsmith-script = { workspace = true }
motionsmith-export = { workspace = true }
motionsmith-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
motionsmith-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
motionsmith-psd = { workspace = true }
motionsmith-svg = { workspace = true }
motionsmith-pdf = { workspace = true }
motionsmith-raster = { workspace = true }
motionsmith-time = { workspace = true }
motionsmith-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
