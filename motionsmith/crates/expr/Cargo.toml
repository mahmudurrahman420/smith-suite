[package]
name = "motionsmith-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
motionsmith-time = { workspace = true }
motionsmith-geom = { workspace = true }
motionsmith-keyframe = { workspace = true }
serde_json = { workspace = true }
motionsmith-project = { workspace = true }
motionsmith-path = { workspace = true }
motionsmith-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
motionsmith-color = { workspace = true }
motionsmith-effects = { workspace = true }
motionsmith-text = { workspace = true }
