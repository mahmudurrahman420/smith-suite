name: Catalog

# Rebuild catalog.json after a Windows release is published, after Build Windows app
# finishes, or when someone runs this workflow by hand. The file is uploaded to the
# rolling release tagged "catalog".
on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ["Build Windows app"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: smith-suite-catalog
  cancel-in-progress: false

jobs:
  catalog:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Generate catalog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked --manifest-path launcher/Cargo.toml -p xtask -- catalog --repo ${{ github.repository }} --out catalog.json
      - name: Publish rolling catalog release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog catalog.json --clobber
          else
            gh release create catalog --title "Catalog" --notes "Rolling catalog.json for Smith Creative Cloud. Regenerated by CI. Do not delete this release." --latest=false catalog.json
          fi
