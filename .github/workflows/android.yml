# Builds the Frame Smith Android APK from framesmith/.
#
# Pull requests and pushes to main that touch framesmith/: a release APK for arm64 phones
# (almost every Android phone since 2017), uploaded as a workflow artifact. A tag
# framesmith-vX.Y.Z also publishes that APK on the GitHub release. Path filters are not
# applied to tag pushes.
#
# Signing: add the repository secrets FRAMESMITH_KEYSTORE_BASE64 (your .jks, base64-encoded),
# FRAMESMITH_KEYSTORE_PASSWORD, FRAMESMITH_KEY_ALIAS and FRAMESMITH_KEY_PASSWORD to sign with your
# own key (needed for Google Play and for updates to install over each other). Without them the
# APK is signed with a throwaway debug key: fine for trying it on a phone.
name: Android APK

on:
  pull_request:
    paths:
      - "framesmith/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    tags: ["framesmith-v*"]
    paths:
      - "framesmith/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Pinned: the image ships the Android SDK, platforms and NDK (ubuntu-latest moved to 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: framesmith
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: framesmith

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: framesmith
          key: android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libframesmith.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "SDK: $ANDROID_HOME  NDK: $ANDROID_NDK_HOME"
          cargo ndk --platform 26 -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release -p framesmith-android
          ls -la android/app/src/main/jniLibs/*

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FRAMESMITH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/framesmith.jks"
            echo "FRAMESMITH_KEYSTORE=$RUNNER_TEMP/framesmith.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the APK is signed with a debug key."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble the APK
        working-directory: framesmith/android
        env:
          FRAMESMITH_KEYSTORE_PASSWORD: ${{ secrets.FRAMESMITH_KEYSTORE_PASSWORD }}
          FRAMESMITH_KEY_ALIAS: ${{ secrets.FRAMESMITH_KEY_ALIAS }}
          FRAMESMITH_KEY_PASSWORD: ${{ secrets.FRAMESMITH_KEY_PASSWORD }}
          FRAMESMITH_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/framesmith-v* ]]; then
            VERSION="${GITHUB_REF_NAME#framesmith-v}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          export FRAMESMITH_VERSION_NAME="$VERSION"
          gradle assembleRelease --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Framesmith-${VERSION}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Framesmith-apk
          path: framesmith/dist/*.apk

      # The newest APK also lives on the `apk` branch: easy to grab with git, and from a phone
      # at github.com/<you>/smith-suite/tree/apk.
      - name: Keep the APK on the apk branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/apk-branch && cd /tmp/apk-branch
          git init -q -b apk
          cp "$GITHUB_WORKSPACE"/framesmith/dist/*.apk Framesmith-latest.apk
          echo "Built from ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})" > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/framesmith-v')
        uses: softprops/action-gh-release@v2
        with:
          files: framesmith/dist/*.apk
